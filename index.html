<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Finder Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="map"></div>

    <div class="controls">
        <h3>Tower Finder</h3>

        <div class="search-group">
            <input type="text" id="searchInput" placeholder="City, Lat,Lon..." />
            <button onclick="searchLocation()">Go</button>
        </div>

        <button id="searchAreaBtn" class="action-btn" onclick="searchCurrentArea()">Search This Area</button>

        <div id="stats">Ready to search.</div>
    </div>

    <!-- Owner Details Modal -->
    <div id="ownerModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Property Details</div>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Content injected here -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Client Logic -->
    <script src="client.js"></script>
</body>

</html>
